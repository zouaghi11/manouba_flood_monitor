<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FloodWatch Manouba - Municipality</title>
<link rel="stylesheet" href="lib/leaflet/leaflet.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
  <h1 data-i18n="muni_h"></h1>
  <div class="row">
    <div class="seg" role="group" aria-label="Mode"><button id="m-live" type="button" aria-pressed="true" data-i18n="mode_live"></button><button id="m-replay" type="button" aria-pressed="false" data-i18n="mode_replay"></button></div>
  </div>
  <div id="banner" class="banner lvl-unknown" aria-live="polite"></div>
  <div id="replay-box" class="card" hidden>
    <label for="slider" data-i18n="replay_time"></label>
    <input id="slider" type="range" min="0" max="0" value="0"><p class="small" id="slider-t"></p>
    <p class="small" data-i18n="replay_hint"></p>
    <h2 data-i18n="tl_h"></h2><p id="timeline"></p><p class="small" data-i18n="tl_note"></p>
  </div>
  <div class="grid2" id="kpis"></div>
  <div class="two" style="margin-top:12px">
    <div class="map" id="map"><div id="map-msg"></div></div>
    <div>
      <section class="card"><h2 style="margin-top:0" data-i18n="why_h"></h2><div id="why"></div><p class="small" id="thr"></p></section>
      <section class="card"><h2 style="margin-top:0" data-i18n="fac_h"></h2><ul class="clean" id="fac"></ul><button class="btn alt" id="fac-toggle" type="button" aria-expanded="false" aria-controls="fac" hidden></button></section>
    </div>
  </div>
  <section class="card"><h2 style="margin-top:0" data-i18n="rain_h"></h2><div class="chart" id="chart"></div><p class="small" data-i18n="rain_note"></p></section>
  <section class="card"><h2 style="margin-top:0" data-i18n="exp_h"></h2><div id="exp"></div><p class="small" data-i18n="exp_note"></p></section>
  <div class="grid2">
    <section class="card"><h2 style="margin-top:0" data-i18n="log_h"></h2><ul class="clean" id="log"></ul><button class="btn alt" id="log-clear" type="button" data-i18n="log_clear"></button></section>
    <section class="card"><h2 style="margin-top:0" data-i18n="rep_h"></h2><ul class="clean" id="reps"></ul><button class="btn alt" id="rep-csv" type="button" data-i18n="rep_csv"></button></section>
  </div>
  <section class="card"><h2 style="margin-top:0" data-i18n="val_h"></h2><p data-i18n="val_p"></p><div id="val"></div><p class="warn" data-i18n="val_note"></p></section>
</main>
<script src="lib/leaflet/leaflet.js"></script>
<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/common.js"></script>
<script src="js/municipality.js"></script>
</body>
</html>
